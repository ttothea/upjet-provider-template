apiVersion: devopsinfra.cps-managedpools.crossplane.io/v1alpha1
kind: ManagedDevOpsPool
metadata:
  name: pool-devex-mdp-crspln
  labels:
    app: managed-devops-pools
    component: pool
    suffix: crspln
spec:
  forProvider:
    location: westeurope
    resourceGroupName: rg-devex-mdp-crspln
    
    # DevCenter project ID (Azure resource ID, not K8s reference)
    # Get this from: kubectl get project dcp-dxp-mdp-crspln -o jsonpath='{.status.atProvider.id}'
    devCenterProjectId: /subscriptions/XXX-XX-xXXX/resourceGroups/rg-devex-mdp-crspln/providers/Microsoft.DevCenter/projects/dcp-dxp-mdp-crspln

    # ── Pool configuration ────────────────────────────────────────────────────
    maximumConcurrency: 1

    # ── Agent profile ────────────────────────────────────────────────────────
    statelessAgent:
      - {}

    # ── Virtual Machine Scale Set fabric ─────────────────────────────────────
    # Minimal VMSS configuration — update with actual subnet when VNet is ready
    virtualMachineScaleSetFabric:
      - skuName: Standard_B1ls
        image:
          - wellKnownImageName: ubuntu-24.04

    # ── Organization profile ─────────────────────────────────────────────────
    # Minimal org config — add actual ADO orgs when ready
    azureDevopsOrganization:
      - organization:
          - url: https://dev.azure.com/DEV-Test
            parallelism: 1
        permission:
          - kind: Inherit

    # ── Managed identity ─────────────────────────────────────────────────────
    # TODO: Configure identity when managed identity is set up
    identity: []

  providerConfigRef:
    name: provider-cps-managedpools
